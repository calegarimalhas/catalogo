<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos - Calegari Malhas</title>
    <!-- Otimizações de Domínio Personalizado -->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <link rel="canonical" href="https://calegariestampas.com.br/">
    <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- Metadados de Compartilhamento (Open Graph - WhatsApp, Facebook, etc) -->
    <meta property="og:title" content="Catálogo Digital - Calegari Malhas">
    <meta property="og:description" content="Confira nosso catálogo completo de estampas: Baby Look, Strass, Sublimação Infantil e Silkscreen. Faça seu pedido online!">
    <meta property="og:image" content="https://calegariestampas.com.br/preview.jpg">
    <meta property="og:url" content="https://calegariestampas.com.br/">
    <meta property="og:type" content="website">
    
    <!-- Ícones -->
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="header-content">
            <h1>Calegari Malhas</h1>
            <div class="cart-icon" onclick="toggleCart()">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 512" width="16" height="16" fill="currentColor" style="vertical-align: middle;"><path d="M0 24C0 10.7 10.7 0 24 0H69.5c22 0 41.5 12.8 50.6 32h411c26.3 0 45.5 25 38.6 50.4l-41 152.3c-8.5 31.4-37 53.3-69.5 53.3H170.7l5.4 28.5c2.2 11.3 12.1 19.5 23.6 19.5H488c13.3 0 24 10.7 24 24s-10.7 24-24 24H199.7c-34.6 0-64.3-24.6-70.7-58.5L77.4 54.5c-.7-3.8-4-6.5-7.9-6.5H24C10.7 48 0 37.3 0 24zM128 464a48 48 0 1 1 96 0 48 48 0 1 1 -96 0zm336-48a48 48 0 1 1 0 96 48 48 0 1 1 0-96z"/></svg>
                <span id="cart-count">0</span>
            </div>
        </div>
        <nav id="tabs-container">
            <!-- As abas serão geradas via JS -->
        </nav>
    </header>

    <main id="catalog-container">
        <!-- O grid de imagens será gerado via JS -->
    </main>

    <!-- Modal do Produto -->
    <div id="product-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div class="modal-body">
                <div class="image-wrapper">
                    <img id="modal-image" src="" alt="Estampa">
                    <video id="modal-video" src="" autoplay loop muted playsinline style="display: none; width: 100%; border-radius: 12px;"></video>
                </div>
                <div class="product-info">
                    <h2 id="modal-title">Código</h2>
                    
                    <div id="strass-selector-container" class="variant-selector" style="display: none;">
                        <h3>Acabamento:</h3>
                        <div class="variant-options">
                            <label class="variant-option">
                                <input type="radio" name="strass-option" value="Com Pedrinha" checked>
                                <span class="variant-btn">
                                    <img src="strass.png" alt="Strass" class="strass-icon" onerror="this.style.display='none'">
                                    Com Pedrinha
                                </span>
                            </label>
                            <label class="variant-option">
                                <input type="radio" name="strass-option" value="Sem Pedrinha">
                                <span class="variant-btn">Sem Pedrinha</span>
                            </label>
                        </div>
                    </div>
                    
                    <div id="variation-selector-container" class="variant-selector" style="display: none;">
                        <h3>Variação:</h3>
                        <div id="variation-options" class="variant-options">
                            <!-- Injetado via JS -->
                        </div>
                    </div>
                    
                    <div id="color-selector-container" class="variant-selector" style="display: none;">
                        <h3>Cor da Camisa:</h3>
                        
                        <!-- Cores Sublimação Infantil -->
                        <div id="color-options-infantil" class="color-options" style="display: none;">
                            <label class="color-option">
                                <input type="radio" name="color-option" value="Branco" checked>
                                <span class="color-btn" style="background: white; border-color: #ddd;">Branco</span>
                            </label>
                            <label class="color-option">
                                <input type="radio" name="color-option" value="Azul Turquesa">
                                <span class="color-btn" style="background: #40e0d0; color: white;">Azul Turquesa</span>
                            </label>
                            <label class="color-option">
                                <input type="radio" name="color-option" value="Rosa Chiclete">
                                <span class="color-btn" style="background: #ffb6c1; color: white;">Rosa Chiclete</span>
                            </label>
                        </div>
                        
                        <!-- Cores Sublimação Infantil Selo -->
                        <div id="color-options-infantil-selo" class="color-options" style="display: none;">
                            <label class="color-option">
                                <input type="radio" name="color-option" value="Preta" checked>
                                <span class="color-btn" style="background: black; color: white;">Preta</span>
                            </label>
                            <label class="color-option">
                                <input type="radio" name="color-option" value="Rosa">
                                <span class="color-btn" style="background: #ffc0cb; color: black;">Rosa</span>
                            </label>
                            <label class="color-option">
                                <input type="radio" name="color-option" value="Marinho">
                                <span class="color-btn" style="background: #000080; color: white;">Marinho</span>
                            </label>
                            <label class="color-option">
                                <input type="radio" name="color-option" value="Vinho">
                                <span class="color-btn" style="background: #722f37; color: white;">Vinho</span>
                            </label>
                        </div>
                        
                        <!-- Cores Baby Look Selo -->
                        <div id="color-options-babylook-selo" class="color-options" style="display: none;">
                            <label class="color-option">
                                <input type="radio" name="color-option" value="Preta" checked>
                                <span class="color-btn" style="background: black; color: white;">Preta</span>
                            </label>
                            <label class="color-option">
                                <input type="radio" name="color-option" value="Branca">
                                <span class="color-btn" style="background: white; border-color: #ddd;">Branca</span>
                            </label>
                            <label class="color-option">
                                <input type="radio" name="color-option" value="Mescla">
                                <span class="color-btn" style="background: #a9a9a9; color: white;">Mescla</span>
                            </label>
                            <label class="color-option">
                                <input type="radio" name="color-option" value="Marinho">
                                <span class="color-btn" style="background: #000080; color: white;">Marinho</span>
                            </label>
                            <label class="color-option">
                                <input type="radio" name="color-option" value="Pink">
                                <span class="color-btn" style="background: #ff1493; color: white;">Pink</span>
                            </label>
                            <label class="color-option">
                                <input type="radio" name="color-option" value="Vinho">
                                <span class="color-btn" style="background: #722f37; color: white;">Vinho</span>
                            </label>
                        </div>
                        
                        <!-- Cores Silkscreen (Quadrados) -->
                        <div id="color-options-silkscreen" class="color-options" style="display: none;">
                            <label class="color-option">
                                <input type="radio" name="color-option-silk" value="Preta" checked>
                                <span class="color-square" style="background: black;" title="Preta"></span>
                            </label>
                            <label class="color-option">
                                <input type="radio" name="color-option-silk" value="Vermelha">
                                <span class="color-square" style="background: #e30000;" title="Vermelha"></span>
                            </label>
                            <label class="color-option">
                                <input type="radio" name="color-option-silk" value="Azul Royal">
                                <span class="color-square" style="background: #2b53a3;" title="Azul Royal"></span>
                            </label>
                            <label class="color-option">
                                <input type="radio" name="color-option-silk" value="Azul Marinho">
                                <span class="color-square" style="background: #000080;" title="Azul Marinho"></span>
                            </label>
                        </div>
                    </div>
                    
                    <div id="print-color-selector-container" class="variant-selector" style="display: none;">
                        <h3>Cor da Estampa:</h3>
                        <div class="print-color-options">
                            <label class="print-color-option">
                                <input type="radio" name="print-color-option" value="Branca" checked>
                                <img src="tintabranca.png" alt="Branca" class="print-color-img">
                            </label>
                            <label class="print-color-option">
                                <input type="radio" name="print-color-option" value="Dourada">
                                <img src="tintadourada.png" alt="Dourada" class="print-color-img">
                            </label>
                            <label class="print-color-option">
                                <input type="radio" name="print-color-option" value="Prata">
                                <img src="tintaprata.png" alt="Prata" class="print-color-img">
                            </label>
                        </div>
                    </div>

                    <div class="size-selector">
                        <h3>Tamanhos (Quantidade):</h3>
                        <div class="sizes-grid">
                            <div class="size-input-group" id="group-size-pp">
                                <label for="size-pp">PP</label>
                                <div class="number-control">
                                    <button type="button" onclick="changeQty('size-pp', -1)">-</button>
                                    <input type="number" id="size-pp" min="0" value="0">
                                    <button type="button" onclick="changeQty('size-pp', 1)">+</button>
                                </div>
                            </div>
                            <div class="size-input-group">
                                <label for="size-p">P</label>
                                <div class="number-control">
                                    <button type="button" onclick="changeQty('size-p', -1)">-</button>
                                    <input type="number" id="size-p" min="0" value="0">
                                    <button type="button" onclick="changeQty('size-p', 1)">+</button>
                                </div>
                            </div>
                            <div class="size-input-group">
                                <label for="size-m">M</label>
                                <div class="number-control">
                                    <button type="button" onclick="changeQty('size-m', -1)">-</button>
                                    <input type="number" id="size-m" min="0" value="0">
                                    <button type="button" onclick="changeQty('size-m', 1)">+</button>
                                </div>
                            </div>
                            <div class="size-input-group">
                                <label for="size-g">G</label>
                                <div class="number-control">
                                    <button type="button" onclick="changeQty('size-g', -1)">-</button>
                                    <input type="number" id="size-g" min="0" value="0">
                                    <button type="button" onclick="changeQty('size-g', 1)">+</button>
                                </div>
                            </div>
                            <div class="size-input-group">
                                <label for="size-gg">GG</label>
                                <div class="number-control">
                                    <button type="button" onclick="changeQty('size-gg', -1)">-</button>
                                    <input type="number" id="size-gg" min="0" value="0">
                                    <button type="button" onclick="changeQty('size-gg', 1)">+</button>
                                </div>
                            </div>
                            <div class="size-input-group" id="group-size-xg">
                                <label for="size-xg">XG</label>
                                <div class="number-control">
                                    <button type="button" onclick="changeQty('size-xg', -1)">-</button>
                                    <input type="number" id="size-xg" min="0" value="0">
                                    <button type="button" onclick="changeQty('size-xg', 1)">+</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="add-to-cart-container">
                        <div id="modal-error-msg" style="display: none; color: #ff4757; font-size: 0.95rem; margin-bottom: 10px; text-align: center; font-weight: 600;"></div>
                        <button class="add-to-cart-btn" onclick="addToCart()">Adicionar ao Pedido</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Carrinho Lateral (Drawer) -->
    <div id="cart-drawer" class="cart-drawer">
        <div class="cart-header">
            <h2>Seu Pedido</h2>
            <button class="close-cart" onclick="toggleCart()">&times;</button>
        </div>
        <div id="cart-items" class="cart-items">
            <!-- Itens do carrinho -->
            <div class="empty-cart-message">Seu carrinho está vazio.</div>
        </div>
        <div class="cart-footer">
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <button class="checkout-btn" onclick="checkout('aparecida')" id="checkout-btn-aparecida" disabled>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" width="16" height="16" fill="currentColor" style="vertical-align: middle;"><path d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zM223.9 413.6c-32.9 0-65.1-8.8-93.5-25.5l-6.7-4-69.5 18.2 18.5-67.7-4.4-7c-18.4-29.2-28.1-63.2-28.1-98.2 0-101.4 82.5-183.9 184-183.9 50.1 0 97.2 19.5 132.6 55 35.4 35.4 54.9 82.5 54.9 132.7 0 101.5-82.6 183.9-184.2 183.9zM324.9 276.4c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7 .9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3s19.9 53.7 22.7 57.4c2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z"/></svg> Enviar pra Calegari Aparecida
                </button>
                <button class="checkout-btn" onclick="checkout('guaratingueta')" id="checkout-btn-guaratingueta" disabled style="background: #128C7E;">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" width="16" height="16" fill="currentColor" style="vertical-align: middle;"><path d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zM223.9 413.6c-32.9 0-65.1-8.8-93.5-25.5l-6.7-4-69.5 18.2 18.5-67.7-4.4-7c-18.4-29.2-28.1-63.2-28.1-98.2 0-101.4 82.5-183.9 184-183.9 50.1 0 97.2 19.5 132.6 55 35.4 35.4 54.9 82.5 54.9 132.7 0 101.5-82.6 183.9-184.2 183.9zM324.9 276.4c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7 .9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3s19.9 53.7 22.7 57.4c2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z"/></svg> Enviar pra Calegari Guaratinguetá
                </button>
            </div>
        </div>
    </div>
    <div id="cart-overlay" class="cart-overlay" onclick="toggleCart()"></div>

    <!-- Toast de Feedback -->
    <div id="toast-container" class="toast-container"></div>

    <script src="dados.js?v=8"></script>
    <script src="script.js?v=8"></script>
</body>
</html>
